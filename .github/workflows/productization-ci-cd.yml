name: Productization CI/CD

on:
  pull_request:
    branches:
      - main
      - deep-learning
    paths:
      - "productization/**"
      - ".github/workflows/productization-ci-cd.yml"
  push:
    branches:
      - main
      - deep-learning
    paths:
      - "productization/**"
      - ".github/workflows/productization-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: productization-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (lint + tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: productization/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: productization/src/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[lint,test]"

      - name: Lint with black
        run: black --check app tests

      - name: Lint with isort
        run: isort --check-only app tests

      - name: Lint with pylint
        run: pylint app tests

      - name: Run tests
        run: pytest

  cd:
    name: CD (build + push Docker image)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: productization
          file: productization/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}